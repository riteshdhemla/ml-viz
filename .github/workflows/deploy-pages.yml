name: Deploy GitHub Pages mirror

# Mirrors the site to https://riteshdhemla.github.io/ml-viz on every push
# to main. Vercel remains the canonical production deployment — the mirror
# is built with GITHUB_PAGES=true (static export + basePath) and its
# robots.txt disallows crawling so the two never compete in search.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Creates the Pages site (Source: GitHub Actions) on first run if the
      # repo doesn't have one yet, so no manual Settings → Pages step needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: /ml-viz
          # Canonical URLs keep pointing at the Vercel production site.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
