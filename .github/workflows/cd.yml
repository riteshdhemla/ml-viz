name: CD — Deploy to Vercel

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"   # matches v1.0.0, v1.2.3-rc1, etc.

concurrency:
  group: production
  cancel-in-progress: false         # never cancel an in-flight production deploy

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────────
  quality:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build (verify it compiles)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

  # ── Production deploy ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel (production)
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment & project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production (via Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Print deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

  # ── Tag the release on GitHub ─────────────────────────────────────────────
  release-notes:
    name: Annotate GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update the release

    steps:
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Deployed to production:** ${{ needs.deploy.outputs.url || vars.NEXT_PUBLIC_SITE_URL }}

            ---
            Auto-generated changelog below.
